# =============================================================================
# Aura — Brand single source of truth
# =============================================================================
# This file is the single source of truth for all brand-related build values.
# `app/build.gradle.kts` loads it and injects into:
#   - defaultConfig.applicationId / versionName / versionCode
#   - resValue "string" "app_name"  (overrides res/values/strings.xml)
#   - buildConfigField BRAND_*       (exposed as com.xiaoqi.companion.BuildConfig)
#   - manifestPlaceholders          (e.g. ${brandLabel})
#
# To rebrand the app (e.g. ship a white-label build), override the values here
# or via -PBRAND_* Gradle properties / environment variables on the command line.
# =============================================================================

# Display / product name shown to users (launcher label, app name, etc.)
BRAND_DISPLAY_NAME=Aura

# Internal product name exposed to code (e.g. BuildConfig.BRAND_NAME) and used
# as the assistant role label. Keep aligned with BRAND_DISPLAY_NAME for now;
# split later if a code name and marketing name diverge.
BRAND_NAME=Aura

# Brand palette (must stay in sync with res/values/colors.xml if you change
# anything beyond the build-time defaults — colors.xml is what Vector Drawables
# actually read at runtime).
BRAND_PRIMARY_COLOR=#7B6EF6
BRAND_ACCENT_COLOR=#C9A96E
BRAND_LAUNCHER_BG=#080808

# Package identity. Changing this is a destructive operation: existing
# installs will be treated as a different app and local databases will be
# wiped. Only change for a fresh release line.
BRAND_PACKAGE=com.xiaoqi.companion

# Version metadata surfaced via PackageManager and BuildConfig.
BRAND_VERSION_NAME=0.1.6
BRAND_VERSION_CODE=7
