<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Aura Logo — 终稿</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080808;
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
  color: #F5F0E8;
  padding: 72px 80px;
}
.label { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: #7B6EF6; opacity: .3; margin-bottom: 52px; }
.row { display: flex; gap: 72px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 80px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.cell-name { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #7B6EF6; opacity: .35; }
hr { border: none; border-top: 1px solid rgba(255,255,255,.05); margin: 16px 0 64px; }
</style>
</head>
<body>

<p class="label">Aura Logo · 终稿 · 不均匀渐变环 + 双色月牙</p>

<!-- 共享图形定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="ring">
      <path d="M 178 100 A 78 78 0 0 1 154.8 155.2" stroke="#7B6EF6" stroke-width="10" stroke-linecap="butt" fill="none" opacity=".50"/>
      <path d="M 154.8 155.2 A 78 78 0 0 1 100 178" stroke="#7B6EF6" stroke-width="14" stroke-linecap="butt" fill="none" opacity=".60"/>
      <path d="M 100 178 A 78 78 0 0 1 45.2 155.2"  stroke="#7B6EF6" stroke-width="20" stroke-linecap="butt" fill="none" opacity=".70"/>
      <path d="M 45.2 155.2 A 78 78 0 0 1 22 100"   stroke="#7B6EF6" stroke-width="26" stroke-linecap="butt" fill="none" opacity=".78"/>
      <path d="M 22 100 A 78 78 0 0 1 45.2 44.8"    stroke="#7B6EF6" stroke-width="30" stroke-linecap="butt" fill="none" opacity=".85"/>
      <path d="M 45.2 44.8 A 78 78 0 0 1 100 22"    stroke="#7B6EF6" stroke-width="26" stroke-linecap="butt" fill="none" opacity=".78"/>
      <path d="M 100 22 A 78 78 0 0 1 154.8 44.8"   stroke="#7B6EF6" stroke-width="18" stroke-linecap="butt" fill="none" opacity=".62"/>
      <path d="M 154.8 44.8 A 78 78 0 0 1 178 100"  stroke="#7B6EF6" stroke-width="13" stroke-linecap="butt" fill="none" opacity=".52"/>
    </g>
  </defs>
</svg>

<div class="row">

  <!-- 主展示 300px -->
  <div class="cell">
    <p style="font-size:8px;letter-spacing:3px;opacity:.2;text-transform:uppercase;margin-bottom:8px;">300px</p>
    <svg width="300" height="300" viewBox="0 0 200 200">
      <defs>
        <mask id="m300_a">
          <circle cx="94" cy="100" r="30" fill="white"/>
          <circle cx="114" cy="116" r="38" fill="black"/>
        </mask>
        <mask id="m300_y">
          <circle cx="114" cy="116" r="38" fill="white"/>
          <circle cx="94" cy="100" r="30" fill="black"/>
        </mask>
      </defs>
      <use href="#ring"/>
      <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#m300_a)"/>
      <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#m300_y)"/>
    </svg>
  </div>

  <!-- 尺寸系统 -->
  <div style="display:flex;flex-direction:column;gap:24px;align-items:flex-start;padding-top:40px;">
    <p style="font-size:8px;letter-spacing:3px;opacity:.2;text-transform:uppercase;margin-bottom:4px;">尺寸系统</p>

    <!-- 120px -->
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="120" height="120" viewBox="0 0 200 200">
        <defs>
          <mask id="m120_a"><circle cx="94" cy="100" r="30" fill="white"/><circle cx="114" cy="116" r="38" fill="black"/></mask>
          <mask id="m120_y"><circle cx="114" cy="116" r="38" fill="white"/><circle cx="94" cy="100" r="30" fill="black"/></mask>
        </defs>
        <use href="#ring"/>
        <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#m120_a)"/>
        <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#m120_y)"/>
      </svg>
      <span style="font-size:8px;opacity:.15;letter-spacing:2px;">120px ✓</span>
    </div>

    <!-- 72px -->
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="72" height="72" viewBox="0 0 200 200">
        <defs>
          <mask id="m72_a"><circle cx="94" cy="100" r="30" fill="white"/><circle cx="114" cy="116" r="38" fill="black"/></mask>
          <mask id="m72_y"><circle cx="114" cy="116" r="38" fill="white"/><circle cx="94" cy="100" r="30" fill="black"/></mask>
        </defs>
        <use href="#ring"/>
        <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#m72_a)"/>
        <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#m72_y)"/>
      </svg>
      <span style="font-size:8px;opacity:.15;letter-spacing:2px;">72px ✓</span>
    </div>

    <!-- 48px -->
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="48" height="48" viewBox="0 0 200 200">
        <defs>
          <mask id="m48_a"><circle cx="94" cy="100" r="30" fill="white"/><circle cx="114" cy="116" r="38" fill="black"/></mask>
          <mask id="m48_y"><circle cx="114" cy="116" r="38" fill="white"/><circle cx="94" cy="100" r="30" fill="black"/></mask>
        </defs>
        <use href="#ring"/>
        <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#m48_a)"/>
        <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#m48_y)"/>
      </svg>
      <span style="font-size:8px;opacity:.15;letter-spacing:2px;">48px ✓</span>
    </div>

    <!-- 32px -->
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="32" height="32" viewBox="0 0 200 200">
        <defs>
          <mask id="m32_a"><circle cx="94" cy="100" r="30" fill="white"/><circle cx="114" cy="116" r="38" fill="black"/></mask>
          <mask id="m32_y"><circle cx="114" cy="116" r="38" fill="white"/><circle cx="94" cy="100" r="30" fill="black"/></mask>
        </defs>
        <use href="#ring"/>
        <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#m32_a)"/>
        <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#m32_y)"/>
      </svg>
      <span style="font-size:8px;opacity:.15;letter-spacing:2px;">32px ✓</span>
    </div>
  </div>

  <!-- App Icon 模拟 -->
  <div class="cell" style="padding-top:40px;">
    <p style="font-size:8px;letter-spacing:3px;opacity:.2;text-transform:uppercase;margin-bottom:16px;">App Icon</p>
    <div style="width:108px;height:108px;border-radius:24px;background:#0D0F1A;border:1px solid rgba(123,110,246,.12);display:flex;align-items:center;justify-content:center;">
      <svg width="78" height="78" viewBox="0 0 200 200">
        <defs>
          <mask id="micon_a"><circle cx="94" cy="100" r="30" fill="white"/><circle cx="114" cy="116" r="38" fill="black"/></mask>
          <mask id="micon_y"><circle cx="114" cy="116" r="38" fill="white"/><circle cx="94" cy="100" r="30" fill="black"/></mask>
        </defs>
        <use href="#ring"/>
        <circle cx="94" cy="100" r="30" fill="#7B6EF6" opacity=".88" mask="url(#micon_a)"/>
        <circle cx="114" cy="116" r="38" fill="#C9A96E" opacity=".58" mask="url(#micon_y)"/>
      </svg>
    </div>
  </div>

</div>

</body>
</html>
