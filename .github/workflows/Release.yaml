name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: "Build & Publish Release"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed release builds"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode keystore
        run: printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          apk_name="aura-v${{ steps.version.outputs.VERSION }}-android-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/${apk_name}"
          (cd release && sha256sum "${apk_name}" > checksums.txt)

      - name: Build release notes
        run: |
          version="${{ steps.version.outputs.VERSION }}"
          tag="${{ github.ref_name }}"
          notes_file="release-notes.md"
          changelog_body="$(awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGLOG.md | sed '/^[[:space:]]*$/N;/^\n$/D')"

          if [ -z "$changelog_body" ]; then
            changelog_body="本次发布。"
          fi

          cat > "$notes_file" << EOF
          ## Aura ${tag}

          Android AI 陪伴应用 · 文本聊天技术闭环 / Phase 1 agent tools

          ### 下载

          | 类型 | 文件 | 说明 |
          |------|------|------|
          | Android Release APK | \`aura-${tag}-android-release.apk\` | 已签名 release APK，适合真机安装测试 |
          | 校验和 | \`checksums.txt\` | SHA-256 |

          > 下载后可用 \`certutil -hashfile <文件> SHA256\`（Windows）或 \`sha256sum <文件>\`（Linux/macOS）与 \`checksums.txt\` 对比验证完整性。

          ### 更新内容

          ${changelog_body}

          ---

          安装与项目说明见 [README](https://github.com/${{ github.repository }}/blob/master/README.md) · [完整 CHANGLOG](https://github.com/${{ github.repository }}/blob/master/CHANGLOG.md)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Aura ${{ github.ref_name }}
          draft: true
          body_path: release-notes.md
          files: |
            release/aura-v${{ steps.version.outputs.VERSION }}-android-release.apk
            release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
