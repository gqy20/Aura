# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Disable AGP 9 built-in Kotlin to allow KAPT usage
# android.builtInKotlin=false
# android.newDsl=false
