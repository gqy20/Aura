# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true

# Disable AGP 9 built-in Kotlin to allow KAPT usage
# android.builtInKotlin=false
# android.newDsl=false

# MNN native runtime (pre-built libMNN.so).
# This is a per-developer / per-CI-runner setting. Put it in local.properties
# (gitignored) so the repo stays platform-neutral and lint's PropertyEscape
# check stays quiet in CI. Example for Windows:
#   auraMnnHome=D\:\C\Desktop\ai\MNN
# Linux/CI runners: leave it unset — the build falls back to packaging the
# MNN stub library.
