default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: aura-file-sanity
        name: Aura file sanity checks
        entry: uv run python scripts/hooks/check_files.py
        language: system
        stages: [pre-commit]
        pass_filenames: true

      - id: aura-commit-message
        name: Aura conventional commit message
        entry: uv run python scripts/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true

      - id: aura-unit-tests
        name: Aura Kotlin/Gradle compile check
        # 只在改动 Kotlin / Gradle / KTS 时跑，避免 docs/web 改动误触发编译
        # 改 docs/web 时直接跳过 — CI workflow 跑 build 是兜底，本地不再重复
        entry: uv run python scripts/hooks/run_gradle.py cleanTestDebugUnitTest testDebugUnitTest --stacktrace
        language: system
        stages: [pre-commit]
        files: '\.(kt|kts|gradle)$'
        pass_filenames: false
